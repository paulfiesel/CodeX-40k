name: Apply vision radar helper compatibility

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout archived Code-X source
        uses: actions/checkout@v4
        with:
          ref: archive/codex-reference-2026-07-27
          path: source
          fetch-depth: 1

      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: runtime/campaign-setup-imperium
          path: runtime
          fetch-depth: 0

      - name: Restore Code-X radar helper family
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('source/3261086933/resource/set/vision/vision_generic.inc')
          target_path = Path('runtime/resource/set/vision/vision_generic.inc')

          source = source_path.read_text(encoding='utf-8', errors='surrogateescape')
          target = target_path.read_text(encoding='utf-8', errors='surrogateescape')

          start_marker = '(define "stealth_plane_in_rad_spectre_short"'
          end_marker = '(define "aviation_in_rad_spectre"'
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          helper_block = source[start:end].rstrip() + '\n'

          anchor = '(define "aviation_in_rad_spectre"'
          if target.count(anchor) != 1:
              raise SystemExit(f'expected exactly one aviation radar anchor, found {target.count(anchor)}')

          names = (
              'stealth_plane_in_rad_spectre_short',
              'stealth_plane_in_rad_spectre',
              'small_UAV_in_rad_spectre',
          )
          for name in names:
              if target.count(f'(define "{name}"') > 1:
                  raise SystemExit(f'duplicate helper definition before patch: {name}')

          if not all(f'(define "{name}"' in target for name in names):
              for name in names:
                  target = target.replace(f'(define "{name}"', f'; removed incomplete helper {name}\n;(define "{name}"', 1) if f'(define "{name}"' in target else target
              target = target.replace(anchor, helper_block + anchor, 1)

          for name in names:
              if target.count(f'(define "{name}"') != 1:
                  raise SystemExit(f'expected one restored helper definition: {name}')

          target_path.write_text(target, encoding='utf-8', errors='surrogateescape', newline='\n')

          audit = Path('runtime/docs/runtime/vision-property-compat.txt')
          audit_text = audit.read_text(encoding='utf-8')
          note = '''\n\nRadar helper follow-up\n- A subsequent startup passed the restored vision property registry and reached `vision_radar_shipSAM`.\n- The compatibility-owned `vision_generic.inc` still referenced `small_UAV_in_rad_spectre` after its three-definition Code-X radar helper block had been omitted.\n- Restored the exact Code-X definitions for `stealth_plane_in_rad_spectre_short`, `stealth_plane_in_rad_spectre`, and `small_UAV_in_rad_spectre`.\n- Existing radar consumers, ranges, multipliers, and Dynamic Conquest data remain unchanged.\n'''
          if 'Radar helper follow-up' not in audit_text:
              audit.write_text(audit_text.rstrip() + note, encoding='utf-8', newline='\n')
          PY

      - name: Extend regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('runtime/tests/test_vision_property_compat.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":\n'
          method = '''\n    def test_radar_helper_family_is_complete(self):\n        text = VISION_GENERIC.read_text(encoding="utf-8")\n\n        for name in (\n            "stealth_plane_in_rad_spectre_short",\n            "stealth_plane_in_rad_spectre",\n            "small_UAV_in_rad_spectre",\n        ):\n            self.assertEqual(text.count(f'(define "{name}"'), 1)\n\n        self.assertIn(\n            '("small_UAV_in_rad_spectre" radar(1) stand_radar(1))',\n            text,\n        )\n'''
          if 'test_radar_helper_family_is_complete' not in text:
              if marker not in text:
                  raise SystemExit('test insertion marker not found')
              text = text.replace(marker, method + marker, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Run focused tests
        shell: bash
        working-directory: runtime
        run: python -m unittest tests.test_vision_property_compat tests.test_vision_settings_compat

      - name: Commit runtime patch
        shell: bash
        working-directory: runtime
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resource/set/vision/vision_generic.inc tests/test_vision_property_compat.py docs/runtime/vision-property-compat.txt
          git commit -m "Restore the Code-X radar helper family"
          git push origin HEAD:runtime/campaign-setup-imperium
