name: Hash parent utility source

on:
  pull_request:
  push:
    branches:
      - runtime/dcg-allied-defense-reinforcements

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch archived Code-X source
        run: git fetch origin archive/imported-codex-snapshot:refs/remotes/origin/archive/imported-codex-snapshot
      - name: Hash inherited utility runtime
        run: git show origin/archive/imported-codex-snapshot:3261086933/resource/script/multiplayer/modes/utility.lua | sha256sum | cut -d ' ' -f1 > utility.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: utility-sha256
          path: utility.sha256
