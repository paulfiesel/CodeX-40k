name: Validate compatibility foundation

on:
  pull_request:

permissions:
  contents: read

jobs:
  export-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage current include ledger
        run: |
          mkdir -p .audit/ledger
          cp docs/external-includes.json .audit/ledger/external-includes.json
      - name: Upload current include ledger
        uses: actions/upload-artifact@v4
        with:
          name: current-external-includes
          path: .audit/ledger/external-includes.json
