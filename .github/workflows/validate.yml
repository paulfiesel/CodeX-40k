name: Validate compatibility foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile tools
        run: python -m compileall -q tools tests
      - name: Trace archived SC skin sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          repo = "paulfiesel/CodeX-40k"
          commit_sha = "d9d2880d21ff38d2c63c06dbe79b870a6e4e437a"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "codex-compat-source-trace",
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          commit = get_json(f"https://api.github.com/repos/{repo}/git/commits/{commit_sha}")
          tree = get_json(
              f"https://api.github.com/repos/{repo}/git/trees/{commit['tree']['sha']}?recursive=1"
          )
          wanted = []
          for entry in tree.get("tree", []):
              path = entry.get("path", "")
              folded = path.casefold()
              if entry.get("type") != "blob":
                  continue
              if "sc_h_skin" in folded or folded.endswith("sc_skin_selector.inc"):
                  wanted.append(entry)

          output = pathlib.Path(".audit/sc-skin-source")
          output.mkdir(parents=True, exist_ok=True)
          report = {
              "commit": commit_sha,
              "tree": commit["tree"]["sha"],
              "tree_truncated": tree.get("truncated", False),
              "files": [],
          }
          for entry in wanted:
              blob = get_json(entry["url"])
              raw = base64.b64decode(blob["content"])
              relative = pathlib.Path(entry["path"])
              destination = output / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(raw)
              report["files"].append(
                  {
                      "path": entry["path"],
                      "git_blob_sha": entry["sha"],
                      "sha256": hashlib.sha256(raw).hexdigest(),
                      "size": len(raw),
                  }
              )
          (output / "report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Upload SC skin source trace
        uses: actions/upload-artifact@v4
        with:
          name: sc-skin-source-trace
          path: .audit/sc-skin-source
      - name: Run unit tests
        run: |
          set +e
          python -m unittest discover -s tests -v > unit-test-output.txt 2>&1
          status=$?
          cat unit-test-output.txt
          exit $status
      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output
          path: unit-test-output.txt
      - name: Enforce dependency source gate
        run: python tools/check_source_gate.py . --status docs/source-status.json
      - name: Validate collision decision ledger
        run: python tools/validate_collision_decisions.py docs/collision-decisions.json
      - name: Validate runtime test record template
        run: python tools/validate_runtime_test_record.py docs/runtime-test-records/template.json
      - name: Build repository manifest
        run: python tools/build_manifest.py . --name compatibility-repository --output .audit/repository.json
      - name: Compare single manifest
        run: python tools/compare_mod_stacks.py --manifest .audit/repository.json --output .audit/collisions.json
      - name: Validate includes
        run: python tools/validate_includes.py .
      - name: Validate identifiers
        run: python tools/validate_identifiers.py .
      - name: Inventory rig references
        run: python tools/validate_rig_references.py . --output .audit/rig-references.json
